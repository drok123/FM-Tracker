name: Host Python tests
on:
  push:
    branches: [dev/tracker-core, main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unittest suite
        run: python -m unittest discover -s tests -v
